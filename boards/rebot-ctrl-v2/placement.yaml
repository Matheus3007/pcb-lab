# Placement for rebot-ctrl-v2. Units mm / deg, board coords (+Y down).
# Each MCU side faces what it talks to (UFQFPN-32 at rot 270):
#   top    PA3..PA0 (TIM2_CH4..1) + PA4 (CURR) + PF0 (VBAT): straight up into the J1 resistor row, cable order
#   right  SPI1 + IMU CS/INT1 -> the IMU right beside it, the flash beyond
#   bottom USART1 (CRSF) -> receiver connector bottom-left; USB -> In2 stripline to the USB-C; SWD -> pads below
#   left   CURR divider, LED, VDDA caps
# Top edge: ESC JST-SH 8P (left) and USB-C (right), mouths up. Left edge: receiver JST-GH 4P (bottom).
# Buck + LDO bottom right, away from the IMU and the MCU's analog pins. Test pads on the bottom side.
parts:
  J1: {at: [6.4, 3.125], rot: 180}      # ESC 8P: pin 1 (GND) x 9.9 ... pin 8 (TLM) x 2.9, pads y 5.125
  J3: {at: [19.05, 3.65], rot: 180}     # USB-C, origin 3.65 mm behind the mouth
  J2: {at: [3.05, 20.2], rot: 270}      # receiver 4P, pin 1 (+5V) top, pads x 4.9
  R17: {at: [2.72, 7.45], rot: 270}     # TLM 1k        (J1 pin 8); pad 1 = the J1 side, up
  R13: {at: [3.78, 7.45], rot: 270}     # CURR 100k     (pin 7)
  R12: {at: [4.84, 7.45], rot: 270}     # M4 100R       (pin 6)
  R11: {at: [5.90, 7.45], rot: 270}     # M3 100R       (pin 5)
  R10: {at: [6.96, 7.45], rot: 270}     # M2 100R       (pin 4)
  R9: {at: [8.02, 7.45], rot: 270}      # M1 100R       (pin 3)
  R15: {at: [9.08, 7.45], rot: 270}     # VBAT 100k     (pin 2)
  U1: {at: [7.43, 12.25], rot: 270}     # top: PA3 PA2 PA1 PA0 NRST PF1 PF0 VDD (x 5.68 .. 9.18)
  R16: {at: [11.6, 8.0], rot: 0}        # VBAT divider bottom
  C18: {at: [11.6, 9.05], rot: 0}       # VBAT filter
  C10: {at: [11.6, 10.1], rot: 0}       # VDD pin 1 (top right corner)
  R14: {at: [3.7, 10.8], rot: 270}      # CURR divider bottom (PA4, left top)
  C17: {at: [2.65, 10.8], rot: 270}     # CURR filter
  R8: {at: [3.3, 12.4], rot: 180}       # LED (PB0)
  D3: {at: [1.0, 10.2], rot: 270}       # status LED, anode down toward R8
  C15: {at: [3.3, 13.45], rot: 180}     # VDDA HF (pin 15)
  C14: {at: [11.5, 18.4], rot: 0}       # 3V3 1 uF (VDDA is tied to 3V3; C15 is the cap at the pin)
  C11: {at: [3.3, 14.5], rot: 180}      # VDD pin 17 (bottom left corner)
  C13: {at: [14.7, 24.35], rot: 0}      # 3V3 bulk
  U4: {at: [13.6, 13.25], rot: 90}      # CS / SCL / SDA face the MCU
  C19: {at: [16.1, 12.6], rot: 0}        # IMU VDD (pin 8, top right), below the FLASH_CS line
  C20: {at: [15.65, 14.6], rot: 270}     # IMU VDDIO (pin 5, right)
  R18: {at: [13.6, 15.9], rot: 0}       # IMU CS pull-up
  U5: {at: [20.45, 13.8], rot: 0}       # flash: CS/DO left, CLK/DI right
  C21: {at: [24.35, 12.0], rot: 90}      # flash VCC (pin 8, right top)
  R19: {at: [16.0, 10.5], rot: 90}      # flash CS pull-up (pad 1 down, on the FLASH_CS line)
  R4: {at: [17.3, 9.96], rot: 90}       # CC2 5.1k
  R3: {at: [20.7, 9.96], rot: 90}       # CC1 5.1k
  D2: {at: [23.0, 9.95], rot: 0}        # VBUS -> +5V: cathode (pad 1) left, anode right
  R1: {at: [6.85, 18.0], rot: 90}       # CRSF in 100R (pad 2 up, MCU side)
  R2: {at: [7.9, 18.0], rot: 90}        # CRSF out 100R
  U2: {at: [17.6, 19.6], rot: 0}
  C2: {at: [15.7, 20.1], rot: 90}       # VIN HF
  C1: {at: [17.6, 22.4], rot: 0}        # VIN 2.2 uF
  R6: {at: [17.6, 17.6], rot: 0}        # FB to GND
  C4: {at: [19.7, 19.25], rot: 90}      # VCC
  C3: {at: [19.9, 21.45], rot: 90}      # BOOT-SW
  R5: {at: [20.0, 17.6], rot: 180}      # FB to V5_BUCK (pad 2 = FB, left)
  L1: {at: [23.0, 18.6], rot: 0}
  C5: {at: [23.0, 21.6], rot: 0}        # 22 uF out
  D1: {at: [23.0, 23.8], rot: 0}        # V5_BUCK -> +5V
  U3: {at: [12.0, 22.6], rot: 0}        # GND / VOUT left, VIN right
  C7: {at: [14.7, 22.6], rot: 90}       # LDO in
  C6: {at: [17.6, 24.3], rot: 180}      # +5V 4.7 uF (pad 1 right, toward D1)
  C8: {at: [9.3, 23.4], rot: 90}        # LDO out
  C9: {at: [9.3, 21.3], rot: 90}        # 3V3 4.7 uF
  C16: {at: [1.0, 13.0], rot: 90}       # NRST (In2 from the TP5 via)
  R7: {at: [13.1, 8.0], rot: 90}        # BOOT0 pull-down (pad 1 down, on the TP6 via)
  TP3: {at: [4.15, 3.2], side: bottom}
  TP4: {at: [6.3, 3.2], side: bottom}
  TP5: {at: [8.2, 8.85], side: bottom}     # NRST, on the via above U1 pad 4
  TP1: {at: [8.45, 3.2], side: bottom}
  TP2: {at: [2.0, 3.2], side: bottom}
  TP6: {at: [13.1, 9.25], side: bottom}    # BOOT0, on the via under R7
rules:   # max_dist = as placed + ~0.5 mm
  - {rule: near, ref: C10, to: U1, pin_pad: "1", max_dist: 2.5, why: "MCU VDD (pin 1) decoupling"}
  - {rule: near, ref: C11, to: U1, pin_pad: "17", max_dist: 2.3, why: "MCU VDD (pin 17) decoupling"}
  - {rule: near, ref: C15, to: U1, pin_pad: "15", max_dist: 2.2, why: "VDDA HF decoupling"}
  - {rule: near, ref: R14, to: U1, pin_pad: "9", max_dist: 1.9, why: "CURR divider at PA4"}
  - {rule: near, ref: C17, to: U1, pin_pad: "9", max_dist: 2.9, why: "CURR filter at PA4"}
  - {rule: near, ref: R16, to: U1, pin_pad: "2", max_dist: 4.2, why: "VBAT divider bottom; PF0's top side is the DShot fan, so it sits in the right strip (DC signal)"}
  - {rule: near, ref: C18, to: U1, pin_pad: "2", max_dist: 5.3, why: "VBAT filter (10 nF on a 100k/10k divider, DC): beside R16"}
  - {rule: near, ref: R8, to: U1, pin_pad: "13", max_dist: 2.1, why: "LED resistor at PB0"}
  - {rule: near, ref: R1, to: J2, pin_pad: "3", max_dist: 3.5, why: "CRSF in series R, upright between the MCU and J2 (the corridor left of the USB vias)"}
  - {rule: near, ref: R2, to: J2, pin_pad: "4", max_dist: 5.1, why: "CRSF out series R, beside R1"}
  - {rule: near, ref: C19, to: U4, pin_pad: "8", max_dist: 1.8, why: "IMU VDD decoupling"}
  - {rule: near, ref: C20, to: U4, pin_pad: "5", max_dist: 2.4, why: "IMU VDDIO decoupling"}
  - {rule: near, ref: C21, to: U5, pin_pad: "8", max_dist: 2.1, why: "flash VCC decoupling"}
  - {rule: near, ref: C2, to: U2, pin_pad: "4", max_dist: 1.6, why: "buck VIN HF"}
  - {rule: near, ref: C1, to: U2, pin_pad: "4", max_dist: 2.4, why: "buck VIN bulk"}
  - {rule: near, ref: C3, to: U2, pin_pad: "6", max_dist: 1.8, why: "buck BOOT"}
  - {rule: near, ref: C4, to: U2, pin_pad: "7", max_dist: 1.9, why: "buck VCC"}
  - {rule: near, ref: R6, to: U2, pin_pad: "8", max_dist: 1.5, why: "buck FB divider"}
  - {rule: near, ref: L1, to: U2, pin_pad: "5", max_dist: 4.4, why: "buck inductor at SW (C3 and R5 sit between them; SW trace ~3.5 mm)"}
  - {rule: near, ref: C7, to: U3, pin_pad: "3", max_dist: 2.1, why: "LDO input cap at VIN (pad 3)"}
  - {rule: near, ref: C8, to: U3, pin_pad: "2", max_dist: 2.2, why: "LDO output cap at VOUT (pad 2)"}
  - {rule: on_edge, ref: J1, edge: top, why: "ESC cable plugs in from the top edge"}
  - {rule: on_edge, ref: J3, edge: top, why: "USB-C mouth at the top edge (reachable with the lid off)"}
  - {rule: on_edge, ref: J2, edge: left, why: "receiver cable comes from the robot left side"}

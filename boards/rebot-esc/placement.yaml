# Placement for rebot-esc. Units: mm / degrees, board coords (+Y down). Board 36 x 20 mm.
# Laid out like an off-the-shelf ESC (B-CUBE): power + signal in on the LEFT short edge, motor pads in a
# column on the RIGHT short edge, one row per phase in between:
#   VBAT bulk cap -> high-side FET (rot 90: drain left, sources right) -> low-side FET (drain left = phase,
#   sources right = GND) -> motor pad. Rows: A y=4.4, B y=10.5, C y=16.6. The phase node is the HS-LS
#   junction; it reaches its pad on the inner/bottom layers past the low-side FET.
# FET gates are at the top-right of each FET, so each row's gate resistors, BEMF divider and HF cap sit in
# the gap ABOVE that row. Header J1 (bottom side, rot 0): pin 1 at the bottom, pins run up; odd column
# x=2.0 (1 VBAT, 3 VBAT, 5 GND, 7 KEY, 9 SWDIO), even x=4.54 (2 VBAT, 4 GND, 6 GND, 8 DSHOT, 10 SWCLK).

parts:
  J1: {at: [2.0, 16.2], rot: 0, side: bottom}
  H1: {at: [2.6, 2.4]}
  # --- power stage rows
  Q1: {at: [24.6, 4.4], rot: 90}      # A high side
  Q2: {at: [29.1, 4.4], rot: 90}      # A low side
  Q3: {at: [24.6, 10.5], rot: 90}     # B
  Q4: {at: [29.1, 10.5], rot: 90}
  Q5: {at: [24.6, 16.6], rot: 90}     # C
  Q6: {at: [29.1, 16.6], rot: 90}
  J2: {at: [33.6, 4.4], rot: 90}      # motor pads, wire leaves over the right edge
  J3: {at: [33.6, 10.5], rot: 90}
  J4: {at: [33.6, 16.6], rot: 90}
  C1: {at: [21.1, 4.4], rot: 90}      # VBAT bulk at each HS drain
  C2: {at: [21.1, 10.5], rot: 90}
  C3: {at: [21.1, 16.6], rot: 90}
  # gap above each row: BEMF divider (top 10k, 1k, star 10k), VBAT HF cap, HS + LS gate resistors
  R11: {at: [21.0, 1.3], rot: 90}
  R12: {at: [22.1, 1.3], rot: 90}
  R13: {at: [23.2, 1.3], rot: 90}
  C4: {at: [24.3, 1.3], rot: 90}
  R5: {at: [26.1, 1.3], rot: 0}
  R6: {at: [30.6, 1.3], rot: 0}
  R14: {at: [21.0, 7.45], rot: 90}
  R15: {at: [22.1, 7.45], rot: 90}
  R16: {at: [23.2, 7.45], rot: 90}
  C5: {at: [24.3, 7.45], rot: 90}
  R7: {at: [26.1, 7.45], rot: 0}
  R8: {at: [30.6, 7.45], rot: 0}
  R17: {at: [21.0, 13.55], rot: 90}
  R18: {at: [22.1, 13.55], rot: 90}
  R19: {at: [23.2, 13.55], rot: 90}
  C6: {at: [24.3, 13.55], rot: 90}
  R9: {at: [26.1, 13.55], rot: 0}
  R10: {at: [30.6, 13.55], rot: 0}
  # --- gate driver: top outputs -> row A, right -> B, bottom -> C
  U2: {at: [16.0, 10.5], rot: 0}
  C14: {at: [19.5, 8.0], rot: 90}     # boot A (BSTA top / SHA right)
  C15: {at: [19.5, 10.5], rot: 90}    # boot B (BSTB / SHB right)
  C16: {at: [19.5, 13.0], rot: 90}    # boot C (BSTC right / SHC bottom)
  C13: {at: [13.6, 14.2], rot: 90}    # GVDD HF (pin 4, left side)
  C12: {at: [16.0, 14.8], rot: 0}     # GVDD bulk
  # --- MCU
  U1: {at: [9.4, 10.5], rot: 0}
  C9: {at: [12.68, 10.9], rot: 90}     # VDD (pin 17, right side), between MCU and driver
  R1: {at: [6.0, 13.5], rot: 90}      # VDDA filter (pin 5)
  C10: {at: [8.0, 13.7], rot: 0}      # VDDA
  R2: {at: [6.0, 9.5], rot: 90}       # NRST pull-up (pin 4)
  C11: {at: [6.0, 11.5], rot: 90}     # NRST
  R3: {at: [6.0, 7.5], rot: 90}       # BOOT0 pull-down (pin 1, top of left side)
  R4: {at: [9.4, 6.9], rot: 0}        # DShot series, above PB4 (pin 25, top)
  # --- 11 V buck, top of the logic area
  U4: {at: [9.0, 2.6], rot: 0}
  C20: {at: [9.0, 0.75], rot: 0}
  R21: {at: [11.2, 1.3], rot: 90}
  C19: {at: [11.2, 3.3], rot: 90}
  L1: {at: [14.0, 2.4], rot: 0}
  C21: {at: [17.6, 2.4], rot: 90}
  R20: {at: [14.0, 5.0], rot: 0}
  C18: {at: [7.0, 2.6], rot: 90}
  C17: {at: [8.9, 5.0], rot: 0}
  # --- 3.3 V LDO, bottom of the logic area
  U3: {at: [9.6, 17.4], rot: 270}
  C7: {at: [13.0, 16.9], rot: 90}     # LDO in
  C8: {at: [6.5, 17.2], rot: 90}
rules:   # max_dist = as placed + 0.5 mm, so later moves can't drift these parts away
  - {rule: near, ref: C9, to: U1, pin_pad: "17", max_dist: 1.9, why: "MCU VDD decoupling"}
  - {rule: near, ref: C10, to: U1, pin_pad: "5", max_dist: 3.3, why: "VDDA decoupling"}
  - {rule: near, ref: C11, to: U1, pin_pad: "4", max_dist: 2.1, why: "NRST cap"}
  - {rule: near, ref: R4, to: U1, pin_pad: "25", max_dist: 2.2, why: "DShot series resistor at PB4"}
  - {rule: near, ref: C13, to: U2, pin_pad: "4", max_dist: 3.5, why: "GVDD HF decoupling"}
  - {rule: near, ref: C12, to: U2, pin_pad: "4", max_dist: 4.7, why: "GVDD bulk"}
  - {rule: near, ref: C14, to: U2, pin_pad: "20", max_dist: 3.3, why: "bootstrap A at BSTA"}
  - {rule: near, ref: C15, to: U2, pin_pad: "17", max_dist: 2.0, why: "bootstrap B at BSTB"}
  - {rule: near, ref: C16, to: U2, pin_pad: "14", max_dist: 2.5, why: "bootstrap C at BSTC"}
  - {rule: near, ref: C18, to: U4, pin_pad: "4", max_dist: 1.8, why: "buck input HF cap at VIN"}
  - {rule: near, ref: C17, to: U4, pin_pad: "4", max_dist: 2.0, why: "buck input cap"}
  - {rule: near, ref: C19, to: U4, pin_pad: "6", max_dist: 1.8, why: "buck bootstrap at BOOT"}
  - {rule: near, ref: C20, to: U4, pin_pad: "7", max_dist: 2.2, why: "buck VCC cap"}
  - {rule: near, ref: R21, to: U4, pin_pad: "8", max_dist: 1.9, why: "feedback divider at FB"}
  - {rule: near, ref: L1, to: U4, pin_pad: "5", max_dist: 3.7, why: "inductor at SW"}
  - {rule: near, ref: C7, to: U3, pin_pad: "2", max_dist: 4.0, why: "LDO input cap"}
  - {rule: near, ref: C8, to: U3, pin_pad: "3", max_dist: 2.5, why: "LDO output cap"}
  - {rule: near, ref: R5, to: Q1, pin_pad: "4", max_dist: 2.7, why: "HS gate resistor A"}
  - {rule: near, ref: R6, to: Q2, pin_pad: "4", max_dist: 2.7, why: "LS gate resistor A"}
  - {rule: near, ref: R7, to: Q3, pin_pad: "4", max_dist: 2.6, why: "HS gate resistor B"}
  - {rule: near, ref: R8, to: Q4, pin_pad: "4", max_dist: 2.6, why: "LS gate resistor B"}
  - {rule: near, ref: R9, to: Q5, pin_pad: "4", max_dist: 2.6, why: "HS gate resistor C"}
  - {rule: near, ref: R10, to: Q6, pin_pad: "4", max_dist: 2.6, why: "LS gate resistor C"}
  - {rule: near, ref: C1, to: Q1, pin_pad: "5", max_dist: 3.6, why: "VBAT bulk at HS drain A"}
  - {rule: near, ref: C2, to: Q3, pin_pad: "5", max_dist: 3.6, why: "VBAT bulk at HS drain B"}
  - {rule: near, ref: C3, to: Q5, pin_pad: "5", max_dist: 3.6, why: "VBAT bulk at HS drain C"}
  - {rule: near, ref: J2, to: Q2, pin_pad: "1", max_dist: 2.4, why: "motor pad A next to its low-side FET"}
  - {rule: near, ref: J3, to: Q4, pin_pad: "1", max_dist: 2.4, why: "motor pad B"}
  - {rule: near, ref: J4, to: Q6, pin_pad: "1", max_dist: 2.4, why: "motor pad C"}

# Accepted findings. Each needs a reason. {check: prefix, match: substring of message, reason}
- check: erc/pin_to_pin
  match: "Symbol U4 Pin 2 [SDX"
  reason: "LSM6DSV32X DS13511 table 2: SDx must be tied to VDD_IO or GND when the analog hub/Qvar is unused; tied to GND"
- check: erc/pin_to_pin
  match: "Symbol U5 Pin 3"
  reason: "W25Q128JV: /WP tied high for standard (non-quad) SPI, as the datasheet requires; IO2 is never driven"
- check: erc/pin_to_pin
  match: "Symbol U5 Pin 7"
  reason: "W25Q128JV: /HOLD tied high for standard (non-quad) SPI, as the datasheet requires; IO3 is never driven"
- check: drc/silk_edge_clearance
  match: "of J3 on F.Silkscreen"
  reason: "USB-C footprint silk outline intentionally reaches the board edge (connector overhang marker, as in pipeline-demo); clipped by fab"
# Routing (2026-10-12, locked route: best of 6, In1+In2 solid GND, signals on F/B only). Each jog was looked at in
# copper_top/bottom.png; layout/return_path is clean, so no step below crosses a gap in its reference plane.
- check: routing/jog
  match: "3V3 on"
  reason: "3V3 distribution, DC and decoupled at every pin; sub-mm steps around the QFN pins and fan-out vias"
- check: routing/jog
  match: "BUCK_SW on F.Cu: 0.20 mm"
  reason: "0.2 mm step where the SW node meets the bootstrap cap C3; adds no measurable loop area (SW trace is 2 mm long)"
- check: routing/jog
  match: "BUCK_VCC on"
  reason: "buck internal regulator pin to its 1 uF cap and RT; DC"
- check: routing/jog
  match: "_ADC on"
  reason: "RC-filtered analog inputs (VBAT/current sense), sampled at kHz; a sub-mm step is electrically irrelevant"
- check: routing/jog
  match: "LED on"
  reason: "status LED drive, DC"
- check: routing/jog
  match: "M3 on F.Cu"
  reason: "J1 (JST-SH, 1.0 mm pitch) pad to the staggered resistor row; the step is the stagger itself"
- check: routing/jog
  match: "SPI_MOSI on"
  reason: "steps at the IMU LGA escape (0.5 mm pitch); SPI <= 10 MHz over ~20 mm with unbroken GND under it (layout/return_path ok)"
- check: routing/jog
  match: "SPI_SCK on"
  reason: "steps around the flash/IMU fan-out vias; SPI <= 10 MHz, return plane unbroken (layout/return_path ok), net is far shorter than the edge-rate wavelength"
- check: routing/jog
  match: "TLM_RX on"
  reason: "ESC telemetry UART RX (115 kbaud) behind a 1k series resistor"
- check: routing/jog
  match: "V5_BUCK on"
  reason: "5.5 V buck output rail after L1, DC"
- check: routing/jog
  match: "BUCK_FB on"
  reason: "buck feedback node leaves U2 pin 8 around the GND pad's top exit to the divider; short, low-impedance divider node, no switching current"
- check: routing/jog
  match: "CRSF_"
  reason: "receiver UART (420 kbaud) through 0402 series resistors into QFN pads 31/32 at 0.5 mm pitch; steps < 0.8 mm"
- check: routing/jog
  match: "DSHOT"
  reason: "fan-out of the TIM3 pins into the staggered resistor rows under the 1.0 mm-pitch J1; DShot600 edges (~100 ns) see a sub-mm step as nothing"
- check: routing/jog
  match: "GND on F.Cu"
  reason: "scripted track from U2's GND pad around its own pins to R6/the via (routing.yaml); intentional"
- check: routing/jog
  match: "IMU_CS on"
  reason: "chip select (one edge per transfer) stepping around the IMU/flash fan-out vias; return plane unbroken"
- check: routing/jog
  match: "IMU_INT1 on"
  reason: "data-ready interrupt (level-like, not clocked) from PC13 past C16/NRST; return plane unbroken"
- check: routing/jog
  match: "M1 on F.Cu"
  reason: "J1 (JST-SH, 1.0 mm pitch) pad to the staggered resistor row; the step is the stagger itself"
- check: routing/jog
  match: "M2 on F.Cu"
  reason: "J1 (JST-SH, 1.0 mm pitch) pad to the staggered resistor row; the step is the stagger itself"
- check: routing/jog
  match: "SPI_MISO on"
  reason: "0.25 mm step at the QFN escape (0.5 mm pitch); SPI <= 10 MHz, return plane unbroken"
- check: routing/jog
  match: "VBAT on F.Cu"
  reason: "0.18 mm step between U2's VIN pin and C1; DC input, the loop itself is checked by layout/loop"

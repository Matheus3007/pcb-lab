# Shared parts library: everything except generic two-pin passives.
# Each entry: LCSC ID, footprint ("Lib:Name": KiCad stock lib, or lib/footprints/<Lib>.pretty),
# symbol (KiCad "Lib:Name" for the generated schematic: stock libs, or lib/symbols/<Lib>.kicad_sym;
# the build cross-checks its pin names against `pins`, `symbol_aliases: {ours: theirs}` for spelling-only
# differences), pins (name -> pad numbers), and the EVIDENCE for the pin mapping. An entry without
# `pinout_source` + `pinout_verified` must not reach review gate 1.

